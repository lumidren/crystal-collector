<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" style="background:#090914; border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff007f;#7928ca;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00f0ff;#ff007f" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#00f0ff;#ff007f;#7928ca" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="crystalShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ff00aa" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.25" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes gridPulse {
        0%, 100% { opacity: 0.18; transform: translateY(0); }
        50% { opacity: 0.35; transform: translateY(-2px); }
      }
      @keyframes floatCrystal {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
        50% { transform: translateY(-10px) rotate(3deg) scale(1.04); }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes laserBorder {
        0% { stroke-dashoffset: 2320; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes petalDrift1 {
        0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translate(-140px, 120px) rotate(260deg); opacity: 0; }
      }
      @keyframes petalDrift2 {
        0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translate(-180px, 150px) rotate(320deg); opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .grid-lines { animation: gridPulse 4s ease-in-out infinite; }
      .hero-crystal { transform-origin: 760px 125px; animation: floatCrystal 4s ease-in-out infinite; }
      .orbit-group { transform-origin: 760px 125px; animation: orbitRing 8s linear infinite; }
      .laser-rect { stroke-dasharray: 400 1920; animation: laserBorder 6s linear infinite; }
      .petal-1 { animation: petalDrift1 6s linear infinite; }
      .petal-2 { animation: petalDrift2 8s linear infinite 2s; }
      .petal-3 { animation: petalDrift1 7s linear infinite 4s; }
      .star-blink { animation: starTwinkle 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Space -->
  <rect width="900" height="260" fill="#0b0b18" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="95" cy="40" r="1.5" class="star-blink" style="animation-delay: 0.2s;" />
    <circle cx="210" cy="85" r="1.2" class="star-blink" style="animation-delay: 1.1s;" />
    <circle cx="340" cy="30" r="1.8" class="star-blink" style="animation-delay: 0.7s;" />
    <circle cx="480" cy="70" r="1.4" class="star-blink" style="animation-delay: 1.8s;" />
    <circle cx="620" cy="35" r="1.6" class="star-blink" style="animation-delay: 0.4s;" />
    <circle cx="850" cy="65" r="1.5" class="star-blink" style="animation-delay: 1.5s;" />
    <circle cx="160" cy="200" r="1.2" class="star-blink" style="animation-delay: 2.1s;" />
    <circle cx="420" cy="220" r="1.4" class="star-blink" style="animation-delay: 0.9s;" />
  </g>

  <!-- Cyber Horizon Grid -->
  <g class="grid-lines" stroke="#00f0ff" stroke-width="1" opacity="0.25">
    <!-- Perspective rays -->
    <line x1="450" y1="130" x2="-50" y2="270" />
    <line x1="450" y1="130" x2="80" y2="270" />
    <line x1="450" y1="130" x2="210" y2="270" />
    <line x1="450" y1="130" x2="340" y2="270" />
    <line x1="450" y1="130" x2="450" y2="270" />
    <line x1="450" y1="130" x2="560" y2="270" />
    <line x1="450" y1="130" x2="690" y2="270" />
    <line x1="450" y1="130" x2="820" y2="270" />
    <line x1="450" y1="130" x2="950" y2="270" />

    <!-- Horizontal grid rungs -->
    <line x1="0" y1="170" x2="900" y2="170" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <line x1="0" y1="225" x2="900" y2="225" />
    <line x1="0" y1="258" x2="900" y2="258" />
  </g>

  <!-- Ground Gradient Overlay -->
  <rect x="0" y="140" width="900" height="120" fill="url(#gridFade)" />

  <!-- Left Content: Game Badge & Title -->
  <g transform="translate(60, 0)">
    <!-- Version Pill Badge -->
    <g transform="translate(0, 36)">
      <rect width="186" height="26" rx="13" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1.2" />
      <circle cx="15" cy="13" r="4" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="800" fill="#00f0ff" letter-spacing="1.5">CRYSTAL COLLECTOR 2.0</text>
    </g>

    <!-- Main Holographic Title -->
    <text x="0" y="108" font-family="'Orbitron', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#cyberGrad)" filter="url(#neonGlow)" letter-spacing="2">
      NEO-ARCADE 3D
    </text>
    <text x="0" y="108" font-family="'Orbitron', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">
      NEO-ARCADE 3D
    </text>

    <!-- Subtitle -->
    <text x="2" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a0c8e6" letter-spacing="1">
      ⚡ 10 PROCEDURAL BIOMES · 6 HEROES · DUAL THEMES · 60 FPS
    </text>

    <!-- Feature Quick Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Three.js 3D -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
      <text x="65" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00f0ff">🎮 Three.js Engine</text>

      <!-- Pill 2: Dual Themes -->
      <rect x="140" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 112, 166, 0.5)" stroke-width="1" />
      <text x="212" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ff70a6">🌸 Dual Aesthetics</text>

      <!-- Pill 3: 47 Tests -->
      <rect x="295" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1" />
      <text x="362" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#00ff88">✔ 47/47 Tests 100%</text>

      <!-- Pill 4: Web Audio -->
      <rect x="440" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 215, 0, 0.4)" stroke-width="1" />
      <text x="512" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffd700">🎵 0 KB Web Audio</text>
    </g>
  </g>

  <!-- Right Hero 3D Floating Crystal & Orbit Ring -->
  <g class="hero-crystal">
    <!-- Ambient back glow -->
    <circle cx="760" cy="125" r="65" fill="#00f0ff" opacity="0.18" filter="url(#neonGlow)" />
    <circle cx="760" cy="125" r="45" fill="#ff00aa" opacity="0.18" filter="url(#neonGlow)" />

    <!-- Orbiting Energy Ring -->
    <g class="orbit-group">
      <ellipse cx="760" cy="125" rx="72" ry="24" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.75" stroke-dasharray="8 6" filter="url(#softGlow)" />
      <circle cx="832" cy="125" r="4" fill="#ffffff" filter="url(#softGlow)" />
      <circle cx="688" cy="125" r="3" fill="#ff00aa" filter="url(#softGlow)" />
    </g>

    <!-- 3D Prismatic Crystal Polygon -->
    <!-- Top Apex Cone Facets -->
    <polygon points="760,45 725,125 760,110" fill="#80f3ff" opacity="0.95" />
    <polygon points="760,45 760,110 795,125" fill="#ffffff" opacity="0.98" />
    <polygon points="760,45 795,125 780,105" fill="#a371f7" opacity="0.9" />

    <!-- Bottom Inverted Cone Facets -->
    <polygon points="760,205 725,125 760,110" fill="#00a8ff" opacity="0.95" />
    <polygon points="760,205 760,110 795,125" fill="#e024c3" opacity="0.95" />
    <polygon points="760,205 795,125 780,145" fill="#ff0077" opacity="0.9" />

    <!-- Center Core Glimmer -->
    <polygon points="760,85 740,125 760,140 780,125" fill="#ffffff" opacity="0.8" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Floating Sakura Blossom Petals -->
  <g>
    <path d="M 860 30 C 865 35, 875 35, 873 45 C 865 42, 858 38, 860 30 Z" fill="#ffb7c5" opacity="0.85" class="petal-1" />
    <path d="M 830 50 C 835 53, 843 53, 841 62 C 834 60, 828 56, 830 50 Z" fill="#ff9ebb" opacity="0.9" class="petal-2" />
    <path d="M 870 90 C 874 94, 882 94, 880 102 C 874 100, 868 96, 870 90 Z" fill="#ffb7c5" opacity="0.75" class="petal-3" />
  </g>

  <!-- Glowing Laser Scanning Border -->
  <rect x="2" y="2" width="896" height="256" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="256" rx="15" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" class="laser-rect" filter="url(#softGlow)" />
</svg>

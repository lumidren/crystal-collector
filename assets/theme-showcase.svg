<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" style="background:#090914; border-radius: 14px; overflow: hidden;">
  <defs>
    <linearGradient id="splitBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff70a6" />
    </linearGradient>

    <linearGradient id="cyberSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b16" />
      <stop offset="100%" stop-color="#10182a" />
    </linearGradient>

    <linearGradient id="dreamSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191325" />
      <stop offset="100%" stop-color="#2a1836" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Half: Cyberpunk Neo-Arcade -->
  <rect x="0" y="0" width="450" height="200" fill="url(#cyberSide)" />

  <!-- Cyberpunk Background Grid Lines -->
  <g stroke="#00f0ff" stroke-width="0.8" opacity="0.18">
    <line x1="0" y1="50" x2="450" y2="50" />
    <line x1="0" y1="100" x2="450" y2="100" />
    <line x1="0" y1="150" x2="450" y2="150" />
    <line x1="90" y1="0" x2="90" y2="200" />
    <line x1="180" y1="0" x2="180" y2="200" />
    <line x1="270" y1="0" x2="270" y2="200" />
    <line x1="360" y1="0" x2="360" y2="200" />
  </g>

  <!-- Left Content: Cyberpunk (Explicit X coordinates, no transform overrides) -->
  <g id="cyber-content">
    <!-- Badge -->
    <rect x="40" y="26" width="136" height="24" rx="12" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1.2" />
    <text x="108" y="42" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#00f0ff" letter-spacing="1">⚡ CYBERPUNK</text>

    <!-- Heading -->
    <text x="40" y="86" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      NEO-ARCADE
    </text>

    <!-- Subtitle -->
    <text x="40" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#88bbdd">
      Obsidian Ground · Electric Cyan Grid · Mecha Hazards
    </text>

    <!-- Spec Badges -->
    <g transform="translate(40, 134)">
      <rect x="0" y="0" width="108" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#00f0ff" stroke-width="1" />
      <text x="54" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#00f0ff">💎 Prismatic Gems</text>

      <rect x="118" y="0" width="118" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#00ff88" stroke-width="1" />
      <text x="177" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#00ff88">🚀 Rocket Thrusters</text>

      <rect x="246" y="0" width="100" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#ffd700" stroke-width="1" />
      <text x="296" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffd700">🐕 Robo-Pup</text>
    </g>
  </g>

  <!-- Right Half: Sakura Dreamland -->
  <rect x="450" y="0" width="450" height="200" fill="url(#dreamSide)" />

  <!-- Sakura Background Grid Lines -->
  <g stroke="#ff70a6" stroke-width="0.8" opacity="0.18">
    <line x1="450" y1="50" x2="900" y2="50" />
    <line x1="450" y1="100" x2="900" y2="100" />
    <line x1="450" y1="150" x2="900" y2="150" />
    <line x1="540" y1="0" x2="540" y2="200" />
    <line x1="630" y1="0" x2="630" y2="200" />
    <line x1="720" y1="0" x2="720" y2="200" />
    <line x1="810" y1="0" x2="810" y2="200" />
  </g>

  <!-- Floating Sakura Petals -->
  <g opacity="0.8">
    <path d="M 780 30 C 785 34, 792 34, 790 40 C 784 38, 778 35, 780 30 Z" fill="#ffb7c5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 840 70 C 845 74, 852 74, 850 80 C 844 78, 838 75, 840 70 Z" fill="#ff9ebb">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M 680 160 C 685 164, 692 164, 690 170 C 684 168, 678 165, 680 160 Z" fill="#ffb7c5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Right Content: Sakura Dreamland (Explicit X coordinates starting at 490) -->
  <g id="sakura-content">
    <!-- Badge -->
    <rect x="490" y="26" width="170" height="24" rx="12" fill="rgba(255, 112, 166, 0.18)" stroke="#ff70a6" stroke-width="1.2" />
    <text x="575" y="42" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ff9ebb" letter-spacing="1">🌸 SAKURA DREAMLAND</text>

    <!-- Heading -->
    <text x="490" y="86" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      MAGICAL REALM
    </text>

    <!-- Subtitle -->
    <text x="490" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e8c2db">
      Porcelain Alabaster · Twilight Sky · Mint Launchers
    </text>

    <!-- Spec Badges -->
    <g transform="translate(490, 134)">
      <rect x="0" y="0" width="112" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#ff70a6" stroke-width="1" />
      <text x="56" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ff70a6">✨ Magical Girl</text>

      <rect x="122" y="0" width="118" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#2dd4bf" stroke-width="1" />
      <text x="181" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">🌸 Mint Jump Pad</text>

      <rect x="250" y="0" width="110" height="26" rx="6" fill="rgba(0,0,0,0.5)" stroke="#ffd700" stroke-width="1" />
      <text x="305" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffd700">🐰 Sugar Bunny</text>
    </g>
  </g>

  <!-- Center Energy Beam Divider (Static X=450, animated stroke & glow) -->
  <g id="center-beam">
    <!-- Background wide glow beam -->
    <line x1="450" y1="0" x2="450" y2="200" stroke="url(#splitBeam)" stroke-width="6" opacity="0.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" />
    </line>
    <!-- Core intense laser line -->
    <line x1="450" y1="0" x2="450" y2="200" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)" />

    <!-- Center Pulse Beacon -->
    <circle cx="450" cy="100" r="16" fill="#00f0ff" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="100" r="8" fill="#ffffff" filter="url(#softGlow)" />

    <!-- Rotating Golden Star Core -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 450 100" to="360 450 100" dur="8s" repeatCount="indefinite" />
      <polygon points="450,88 454,97 464,100 454,103 450,112 446,103 436,100 446,97" fill="#ffd700" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Outer Protective Border -->
  <rect x="1.5" y="1.5" width="897" height="197" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
</svg>
